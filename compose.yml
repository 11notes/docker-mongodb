name: "db"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  mongodb:
    image: "11notes/mongodb:4.4.30"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      # make a full database backup each day at 03:00
      MONGODB_BACKUP_SCHEDULE: "0 3 * * *"
      # only keep the last five backups
      MONGODB_BACKUP_RETENTION: 5
    networks:
      backend:
    volumes:
      - "mongodb.var:/mongodb/var"
      - "mongodb.backup:/mongodb/backup"
    tmpfs:
      # needed because the image runs read-only
      - "/mongodb/run:uid=1000,gid=1000"
    restart: "always"

volumes:
  mongodb.var:
  mongodb.backup:

networks:
  backend:
    internal: true